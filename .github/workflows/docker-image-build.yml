name: Build and Publish Docker Image

on:
  push:
    branches: [release/*]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-test-only
          POSTGRES_DB: mwit_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mwit_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - run: bun install --frozen-lockfile
      - run: bun x prisma generate
      - run: bun run lint
      - run: bun run test:qr && bun run test:direct-links
      - name: Verify existing-database recovery and data preservation
        run: bun run test:migrations
        env:
          TEST_DATABASE_URL: postgresql://postgres:migration-test-only@localhost:5432/mwit_migration_test

  build-and-push-image:
    needs: migration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
      
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        env:
          DOTENV_PRIVATE_KEY_BUILD: ${{ secrets.DOTENV_PRIVATE_KEY_BUILD }}
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_BUILD_COMMIT=${{ github.sha }}
            GIT_BUILD_BRANCH=${{ github.ref }}
            GIT_BUILD_TAG=${{ github.event_name == 'push' && contains(github.ref, 'refs/tags/') && github.ref || '' }}
